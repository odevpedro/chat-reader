server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  shutdown: graceful

spring:
  application:
    name: chat-reader

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chatreader}
    username: ${POSTGRES_USER:chatreader}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    # 'validate' apenas: o schema vem SEMPRE do Flyway (secao 29).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${IMPORT_MAX_BYTES:10485760}
      max-request-size: ${IMPORT_MAX_BYTES:10485760}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

chatreader:
  auth:
    enabled: ${AUTH_ENABLED:true}
    username: ${CHAT_READER_USERNAME:reader}
    # Hash BCrypt da senha. Gere com:
    #   htpasswd -bnBC 10 "" 'sua-senha' | tr -d ':\n'
    # Nunca comite o valor; use a variavel de ambiente.
    password-hash: ${CHAT_READER_PASSWORD_HASH:}
    jwt-secret: ${JWT_SECRET:}
    expiration-days: ${JWT_EXPIRATION_DAYS:30}
  import:
    max-bytes: ${IMPORT_MAX_BYTES:10485760}
    max-chats: ${IMPORT_MAX_CHATS:10000}
    max-messages-per-chat: ${IMPORT_MAX_MESSAGES_PER_CHAT:5000}
  # docs/sync-protocol.md, secao 9
  sync:
    default-limit: ${SYNC_DEFAULT_LIMIT:200}
    max-limit: ${SYNC_MAX_LIMIT:1000}
    retention-days: ${SYNC_RETENTION_DAYS:30}
    max-messages-per-change: ${SYNC_MAX_MESSAGES_PER_CHANGE:200}
    snapshot-default-page-size: ${SYNC_SNAPSHOT_PAGE_SIZE:50}
    max-bookmarks-in-snapshot: ${SYNC_MAX_BOOKMARKS_IN_SNAPSHOT:1000}
    max-log-rows: ${SYNC_MAX_LOG_ROWS:1000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: chat-reader

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.example.chatreader: INFO
    org.hibernate.SQL: WARN
