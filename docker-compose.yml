services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatreader}
      POSTGRES_USER: ${POSTGRES_USER:-chatreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatreader} -d ${POSTGRES_DB:-chatreader}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Nao exponha o banco fora da rede do compose em producao.
    # Descomente apenas para inspecao local:
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-chatreader}
      POSTGRES_USER: ${POSTGRES_USER:-chatreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SERVER_PORT: 8080
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      CHAT_READER_USERNAME: ${CHAT_READER_USERNAME:-reader}
      CHAT_READER_PASSWORD_HASH: ${CHAT_READER_PASSWORD_HASH:?defina CHAT_READER_PASSWORD_HASH no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRATION_DAYS: ${JWT_EXPIRATION_DAYS:-30}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-10485760}
      IMPORT_MAX_CHATS: ${IMPORT_MAX_CHATS:-10000}
      IMPORT_MAX_MESSAGES_PER_CHAT: ${IMPORT_MAX_MESSAGES_PER_CHAT:-5000}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
